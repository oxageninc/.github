name: Task
description: A unit of work with an explicit definition of done
body:
  - type: markdown
    attributes:
      value: |
        File the issue complete. Since 2026-10-02 a new issue in an Oxagen organization carries no `TRIAGE` label. Title it `<Priority> <Tier> <Size> <Kind> (<Area>): <Statement>`, apply one priority, `MODEL:`, `SIZE:`, `KIND:`, and `AREA:` label, set the issue type to the kind, and fill the Priority, Model Tier, Minutes Estimated, and Area(s) fields. Apply `MIGRATION-REQUIRED` once you know the work changes a stored schema. The reference is `issue-management.html` in oxageninc/roadmap.
  - type: textarea
    id: context
    attributes: { label: Context, description: Why this exists; link the origin task. }
    validations: { required: true }
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      description: Checklist the closer must verify line-by-line.
      # No "CI green" item (oxageninc/product#4200). Branch protection already
      # blocks a merge while CI is red. The `dod` check is part of CI, so a box
      # about CI can never be ticked while `dod` reads it.
      value: |
        - [ ] Implementation complete
        - [ ] Scoped tests added/updated and passing
        - [ ] Code comments and docs updated
        - [ ] Residue filed as complete issues, with labels, issue type, and fields
    validations: { required: true }
