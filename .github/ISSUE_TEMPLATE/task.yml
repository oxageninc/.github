name: Task
description: A unit of work with an explicit definition of done
body:
  - type: markdown
    attributes:
      value: |
        File the issue complete. Since 2026-10-02 a new issue in an Oxagen organization carries no `TRIAGE` label. Title it `<Priority> <Tier> <Size> <Kind> (<Area>): <Statement>`, apply one priority, `MODEL:`, `SIZE:`, `KIND:`, and `AREA:` label, set the issue type to the kind, and fill the Priority, Model Tier, Estimated Minutes, and Area(s) fields. The reference is `issue-management.html` in oxageninc/roadmap.
  - type: textarea
    id: context
    attributes: { label: Context, description: Why this exists; link the origin task. }
    validations: { required: true }
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      description: Checklist the closer must verify line-by-line.
      value: |
        - [ ] Implementation complete
        - [ ] Scoped tests added/updated and passing
        - [ ] Full CI green
        - [ ] Code comments and docs updated
        - [ ] Residue filed as complete issues, with labels, issue type, and fields
    validations: { required: true }
